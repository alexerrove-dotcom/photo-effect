name: Build Cat vs Dogs APK

on:
  push:
    branches: [ cat-vs-dogs-cloud-build ]
    paths:
      - 'catdogs/**'
      - '.github/workflows/catdogs-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot and Android SDK 35
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config ~/.android
          if [ -d /root/.local/share/godot/export_templates/4.5.stable ]; then
            cp -r /root/.local/share/godot/export_templates/4.5.stable ~/.local/share/godot/export_templates/
          fi
          if [ -d /root/.config/godot ]; then
            cp -r /root/.config/godot ~/.config/ || true
          fi
          if [ -f /root/.android/debug.keystore ]; then
            cp /root/.android/debug.keystore ~/.android/debug.keystore
          fi
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;35.0.0" "platforms;android-35"
          godot --version
          java -version
          echo "SDK=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

      - name: Parse project and scripts
        shell: bash
        run: |
          cd catdogs
          godot --headless --path . --editor --quit

      - name: Runtime smoke test
        shell: bash
        run: |
          cd catdogs
          set +e
          timeout 6s godot --headless --path . > /tmp/catdogs-runtime.log 2>&1
          RC=$?
          set -e
          cat /tmp/catdogs-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access" /tmp/catdogs-runtime.log; then
            echo "Runtime smoke test found errors"
            exit 1
          fi
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 124 ]; then
            echo "Runtime smoke test failed with $RC"
            exit "$RC"
          fi

      - name: Export Android debug APK
        shell: bash
        run: |
          mkdir -p build
          cd catdogs
          godot --headless --verbose --path . --export-debug "Android" ../build/CatVsDogs-WarZone.apk
          test -s ../build/CatVsDogs-WarZone.apk
          ls -lh ../build/CatVsDogs-WarZone.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatVsDogs-WarZone-APK
          path: build/CatVsDogs-WarZone.apk
          if-no-files-found: error
          retention-days: 14
