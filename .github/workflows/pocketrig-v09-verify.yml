name: PocketRig3D v0.9 Godot verification
on:
  push:
    branches: [build-pocketrig3d-20261119]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.2
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -L --fail -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d /tmp
          mv /tmp/Godot_v4.6.2-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          /tmp/godot --version
      - name: Decode isolated PocketRig v0.9
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pocket
          base64 -d ci/pocketrig_v09_source.b64 | tar -xJf - -C pocket
          ls -lah pocket/scripts/main.gd
      - name: Parse and import Godot project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot --headless --editor --path pocket --import --quit 2>&1 | tee parse.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script|Could not parse' parse.log; then exit 1; fi
      - name: Run scene smoke test for 10 frames
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot --headless --path pocket --quit-after 10 2>&1 | tee run.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Parser Error|Invalid call|Failed to load script' run.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PocketRig-v09-validation-logs
          path: |
            parse.log
            run.log
          retention-days: 5
