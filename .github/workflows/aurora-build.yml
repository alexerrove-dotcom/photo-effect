name: Aurora 0.4 Godot Android Build
on:
  push:
    branches: [build/aurora-v02-android]
    paths: ['aurora-build/**', '.github/workflows/aurora-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Restore Aurora source and higher-detail models
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-pip
          mkdir -p project_pre
          base64 --decode aurora-build/source-recipe.base64 > /tmp/aurora04.zip
          unzip -q /tmp/aurora04.zip -d project_pre
          python3 -m pip install --quiet 'numpy<3' pillow trimesh
          python3 project_pre/tools/build_base_assets.py
          python3 project_pre/tools/build_detail_assets.py
          test -f project/assets/models/maple_amber_v04.glb
          test -f project/assets/models/hero_torso_v04.glb
      - name: Import and validate game in Godot
        shell: bash
        run: |
          set -euo pipefail
          HOME=/root godot --headless --path project --import 2>&1 | tee godot_import.log
          if grep -E -i 'Parse Error|script.*error|Failed loading.*script' godot_import.log; then exit 22; fi
      - name: Launch main scene and detect runtime script errors
        shell: bash
        run: |
          set -euo pipefail
          timeout 75s env HOME=/root godot --headless --path project --quit-after 12 2>&1 | tee godot_runtime.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Invalid get index' godot_runtime.log; then exit 23; fi
      - name: Export Android APK from Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/build
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/root/debug.keystore GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android HOME=/root godot --headless --path project --export-debug "Android" "$GITHUB_WORKSPACE/project/build/Aurora-v0.4-Android-debug.apk" 2>&1 | tee godot_export.log
          test -s project/build/Aurora-v0.4-Android-debug.apk
          unzip -t project/build/Aurora-v0.4-Android-debug.apk | tail -1
          sha256sum project/build/Aurora-v0.4-Android-debug.apk
      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-v0.4-Android-build
          path: |
            project/build/*.apk
            godot_import.log
            godot_runtime.log
            godot_export.log
          if-no-files-found: warn
          retention-days: 14
