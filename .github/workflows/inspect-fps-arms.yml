name: Inspect FPS Arms

on:
  push:
    branches: [ cat-vs-dogs-cloud-build ]
    paths: [ '.github/workflows/inspect-fps-arms.yml' ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and fetch arms
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
          curl -L --fail -o /tmp/arms.glb 'https://media.githubusercontent.com/media/DavidAdeboye/Aftersignal/cb709d17f6a636e560ee47b6668332dfe188a879/models/free_fps_arms_gameready_-_rigged.glb'
          file /tmp/arms.glb
          ls -lh /tmp/arms.glb
          cat > /tmp/inspect.py <<'PY'
          import bpy
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.gltf(filepath='/tmp/arms.glb')
          for o in bpy.context.scene.objects:
              if o.type=='MESH':
                  print('MESH',o.name,'verts',len(o.data.vertices),'dims',tuple(round(x,3) for x in o.dimensions),'mats',[m.name if m else None for m in o.data.materials])
              elif o.type=='ARMATURE':
                  print('ARM',o.name,'bones',[b.name for b in o.data.bones])
          print('ACTIONS',[(a.name,tuple(round(x,1) for x in a.frame_range)) for a in bpy.data.actions])
          PY
          blender -b --python /tmp/inspect.py
