name: Inspect CatDogs Assets
on:
  workflow_dispatch:
  push:
    branches: [ cat-vs-dogs-cloud-build ]
    paths:
      - 'catdogs/assets/**'
      - 'catdogs/inspect_assets.gd'
      - '.github/workflows/catdogs-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5
    steps:
      - uses: actions/checkout@v4
      - name: Import and inspect
        shell: bash
        run: |
          curl -L --fail -o catdogs/assets/fps_props.glb https://raw.githubusercontent.com/TheJenos/shootup-area-fps/e4880646bac980b6c62aa928907debaf7a3e60c8/public/models/props.glb
          cd catdogs
          godot --headless --editor --quit --path .
          godot --headless --path . -s inspect_assets.gd
