name: Build PocketRig3D Android APK
on:
  push:
    branches:
      - build-pocketrig3d-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.6.2'
          use-dotnet: false
          include-templates: true
      - name: Unpack PocketRig3D project
        run: |
          mkdir -p PocketRig3D/work
          base64 --decode ci/pocketrig_v09_source.b64 | tar -xJ -C PocketRig3D/work
          python3 ci/patch_rig_primitive_mesh.py PocketRig3D/work/scripts/main.gd
          sed -i 's/org.pocketrig.s25v08/org.pocketrig.s25v09/' PocketRig3D/work/export_presets.cfg
          sed -i 's/version\/code=8/version\/code=9/' PocketRig3D/work/export_presets.cfg
          sed -i 's/version\/name="0.8.0"/version\/name="0.9.0"/' PocketRig3D/work/export_presets.cfg
          sed -i 's/config\/features=PackedStringArray("4.5"/config\/features=PackedStringArray("4.6"/' PocketRig3D/work/project.godot
          sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' PocketRig3D/work/project.godot
          mkdir -p "$HOME/.android"
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
      - name: Verify GDScript import
        run: |
          godot --headless --path PocketRig3D/work --editor --import --quit
      - name: Smoke test project startup
        run: |
          set -o pipefail
          godot --headless --path PocketRig3D/work --quit-after 8 2>&1 | tee /tmp/pocketrig-smoke.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Invalid call|ERROR:" /tmp/pocketrig-smoke.log; then
            exit 1
          fi
      - name: Export signed ARM64 APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/PocketRig3D/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cp "$HOME/.android/debug.keystore" PocketRig3D/debug.keystore
          godot --headless --path PocketRig3D/work --export-debug Android "$GITHUB_WORKSPACE/PocketRig3D.apk"
          test -s PocketRig3D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PocketRig3D-Android-APK
          path: PocketRig3D.apk
          if-no-files-found: error
