<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>Фото + эффект</title>

<script src="/sdk.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    min-height:100%;

    font-family:Arial,sans-serif;

    background:#111;
    color:#fff;

    overflow:hidden;

    overscroll-behavior:none;
}

body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.app{
    width:min(1100px,96vw);
    height:100dvh;

    padding:18px;

    display:flex;
    flex-direction:column;
}

h1{
    text-align:center;

    margin:0 0 16px;

    font-size:clamp(
        22px,
        4vw,
        32px
    );
}

.controls{
    display:flex;

    gap:10px;

    flex-wrap:wrap;

    justify-content:center;
    align-items:center;

    margin-bottom:14px;
}

button,
.fileLabel{
    border:0;

    border-radius:10px;

    padding:13px 18px;

    background:#168cff;

    color:#fff;

    font-weight:700;

    cursor:pointer;

    font-size:15px;

    touch-action:manipulation;

    user-select:none;
    -webkit-user-select:none;

    display:inline-flex;
    align-items:center;
    justify-content:center;
}

button:hover,
.fileLabel:hover{
    background:#0879df;
}

button:active,
.fileLabel:active{
    transform:scale(.98);
}

button:disabled{
    opacity:.6;
    cursor:default;
}

input[type=file]{
    display:none;
}

.range{
    display:flex;

    align-items:center;

    gap:8px;

    background:#222;

    padding:8px 12px;

    border-radius:10px;

    white-space:nowrap;
}

.range input{
    width:130px;
}

#canvasWrap{
    width:100%;

    flex:1;

    min-height:220px;

    background:#222;

    border-radius:12px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    padding:10px;

    position:relative;
}

canvas{
    max-width:100%;
    max-height:100%;

    display:block;

    object-fit:contain;

    background:transparent;
}

.placeholder{
    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    color:#777;

    font-size:15px;

    pointer-events:none;

    padding:20px;
}

.hint{
    text-align:center;

    color:#aaa;

    font-size:13px;

    margin-top:10px;
}

.status{
    text-align:center;

    margin-top:8px;

    min-height:18px;

    color:#7fc8ff;

    font-size:14px;
}

@media(max-width:600px){

    .app{
        width:100vw;
        padding:10px;
    }

    h1{
        margin-bottom:10px;
    }

    .controls{
        gap:7px;
        margin-bottom:8px;
    }

    button,
    .fileLabel{
        padding:11px 13px;
        font-size:14px;
    }

    .range{
        width:100%;
        justify-content:center;
    }

    .range input{
        flex:1;
        max-width:180px;
    }

    #canvasWrap{
        min-height:180px;
    }
}

</style>
</head>

<body>

<div class="app">

    <h1 id="title">Фото + эффект</h1>

    <div class="controls">

        <label class="fileLabel">
            <span id="uploadText">Загрузить фото</span>

            <input
                id="photoInput"
                type="file"
                accept="image/*"
            >
        </label>

        <div class="range">

            <span id="opacityText">
                Непрозрачность
            </span>

            <input
                id="opacity"
                type="range"
                min="0"
                max="100"
                value="85"
            >

            <b id="opacityValue">85%</b>

        </div>

        <button
            id="download"
            type="button"
        >
            Скачать PNG
        </button>

    </div>

    <div id="canvasWrap">

        <div
            id="placeholder"
            class="placeholder"
        >
            Загрузите фотографию
        </div>

        <canvas id="canvas"></canvas>

    </div>

    <div
        class="hint"
        id="hint"
    >
        Эффект Effects.png автоматически накладывается на фотографию.
    </div>

    <div
        id="status"
        class="status"
    ></div>

</div>

<script>

"use strict";

/* =====================================================
   YANDEX GAMES SDK
===================================================== */

let ysdk = null;
let yandexSDKReady = false;
let currentLanguage = "ru";

/*
 * SDK не должен блокировать запуск приложения.
 */
async function initYandexSDK(){

    try{

        if(
            typeof YaGames === "undefined"
        ){

            console.log(
                "Yandex SDK отсутствует. Локальный режим."
            );

            setLanguage("ru");

            return false;
        }

        ysdk = await Promise.race([

            YaGames.init(),

            new Promise(function(resolve){

                setTimeout(function(){

                    resolve(null);

                },5000);

            })

        ]);

        if(!ysdk){

            console.log(
                "Yandex SDK timeout."
            );

            setLanguage("ru");

            return false;
        }

        /*
         * Требование 2.14
         * Автоматическое определение языка
         */

        try{

            const lang =
                ysdk.environment &&
                ysdk.environment.i18n &&
                ysdk.environment.i18n.lang;

            if(
                typeof lang === "string" &&
                lang.toLowerCase().startsWith("ru")
            ){

                currentLanguage = "ru";

            }
            else{

                currentLanguage = "en";

            }

        }
        catch(error){

            console.warn(
                "Language detection error:",
                error
            );

            currentLanguage = "ru";

        }

        setLanguage(
            currentLanguage
        );

        yandexSDKReady = true;

        console.log(
            "Yandex Games SDK initialized:",
            currentLanguage
        );

        return true;

    }
    catch(error){

        console.warn(
            "Yandex SDK initialization failed:",
            error
        );

        /*
         * Приложение продолжает работать
         * даже если SDK недоступен.
         */

        currentLanguage = "ru";

        setLanguage("ru");

        return false;
    }
}


/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext(
        "2d",
        {
            alpha:true
        }
    );

const photoInput =
    document.getElementById("photoInput");

const opacityInput =
    document.getElementById("opacity");

const opacityValue =
    document.getElementById("opacityValue");

const downloadButton =
    document.getElementById("download");

const status =
    document.getElementById("status");

const title =
    document.getElementById("title");

const uploadText =
    document.getElementById("uploadText");

const opacityText =
    document.getElementById("opacityText");

const hint =
    document.getElementById("hint");

const placeholder =
    document.getElementById("placeholder");


/* =====================================================
   ПЕРЕМЕННЫЕ
===================================================== */

let photo = null;
let effect = null;

let busy = false;
let effectReady = false;


/* =====================================================
   ПЕРЕВОДЫ
===================================================== */

const translations = {

    ru:{

        title:
            "Фото + эффект",

        upload:
            "Загрузить фото",

        opacity:
            "Непрозрачность",

        download:
            "Скачать PNG",

        hint:
            "Эффект Effects.png автоматически накладывается на фотографию.",

        loadingEffect:
            "Загрузка эффекта...",

        effectReady:
            "Эффект готов.",

        effectError:
            "Effects.png не найден.",

        loadingPhoto:
            "Загрузка фотографии...",

        photoReady:
            "Фото загружено.",

        photoError:
            "Не удалось загрузить фотографию.",

        noPhoto:
            "Сначала загрузите фотографию.",

        preparing:
            "Создаём PNG...",

        downloadStarted:
            "Скачивание запущено.",

        downloadError:
            "Не удалось сохранить изображение.",

        invalidImage:
            "Выбранный файл не является изображением.",

        imageLoadError:
            "Не удалось загрузить фото.",

        pngError:
            "Не удалось создать PNG.",

        readyWithoutEffect:
            "Фото загружено. Эффект недоступен."

    },

    en:{

        title:
            "Photo + Effect",

        upload:
            "Upload photo",

        opacity:
            "Opacity",

        download:
            "Download PNG",

        hint:
            "Effects.png is automatically applied to the photo.",

        loadingEffect:
            "Loading effect...",

        effectReady:
            "Effect ready.",

        effectError:
            "Effects.png was not found.",

        loadingPhoto:
            "Loading photo...",

        photoReady:
            "Photo loaded.",

        photoError:
            "Failed to load photo.",

        noPhoto:
            "Please upload a photo first.",

        preparing:
            "Creating PNG...",

        downloadStarted:
            "Download started.",

        downloadError:
            "Failed to save image.",

        invalidImage:
            "The selected file is not an image.",

        imageLoadError:
            "Failed to load photo.",

        pngError:
            "Failed to create PNG.",

        readyWithoutEffect:
            "Photo loaded. Effect unavailable."

    }

};


function setLanguage(lang){

    currentLanguage =
        lang === "ru"
            ? "ru"
            : "en";

    const tr =
        translations[currentLanguage];

    document.documentElement.lang =
        currentLanguage;

    title.textContent =
        tr.title;

    uploadText.textContent =
        tr.upload;

    opacityText.textContent =
        tr.opacity;

    downloadButton.textContent =
        tr.download;

    hint.textContent =
        tr.hint;

}


function t(){

    return translations[currentLanguage];

}


/* =====================================================
   СТАТУС
===================================================== */

function setStatus(text){

    status.textContent =
        text;

}


/* =====================================================
   EFFECTS.PNG
===================================================== */

function loadEffect(){

    return new Promise(
        function(resolve,reject){

            const img =
                new Image();

            img.onload =
                function(){

                    effectReady = true;

                    resolve(img);

                };

            img.onerror =
                function(){

                    effectReady = false;

                    reject(
                        new Error(
                            "Effects.png not found"
                        )
                    );

                };

            /*
             * ВАЖНО:
             * файл должен называться
             * именно Effects.png
             */

            img.src =
                "./Effects.png?cache=" +
                Date.now();

        }
    );

}


/* =====================================================
   ЗАГРУЗКА ФОТО
===================================================== */

function readImage(file){

    return new Promise(
        function(resolve,reject){

            if(
                !file ||
                !file.type ||
                !file.type.startsWith("image/")
            ){

                reject(
                    new Error(
                        t().invalidImage
                    )
                );

                return;
            }

            const url =
                URL.createObjectURL(file);

            const img =
                new Image();

            img.onload =
                function(){

                    URL.revokeObjectURL(url);

                    if(
                        !img.naturalWidth ||
                        !img.naturalHeight
                    ){

                        reject(
                            new Error(
                                t().imageLoadError
                            )
                        );

                        return;
                    }

                    resolve(img);

                };

            img.onerror =
                function(){

                    URL.revokeObjectURL(url);

                    reject(
                        new Error(
                            t().imageLoadError
                        )
                    );

                };

            img.src = url;

        }
    );

}


/* =====================================================
   ОТРИСОВКА
===================================================== */

function render(){

    if(!photo){

        canvas.style.display =
            "none";

        placeholder.style.display =
            "flex";

        return false;
    }

    const width =
        photo.naturalWidth;

    const height =
        photo.naturalHeight;

    if(
        !width ||
        !height
    ){

        return false;
    }

    canvas.width =
        width;

    canvas.height =
        height;

    canvas.style.display =
        "block";

    placeholder.style.display =
        "none";

    ctx.globalAlpha = 1;

    ctx.globalCompositeOperation =
        "source-over";

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    /*
     * ФОТО
     */

    ctx.drawImage(
        photo,
        0,
        0,
        width,
        height
    );

    /*
     * EFFECTS.PNG
     */

    if(
        effectReady &&
        effect &&
        effect.naturalWidth > 0 &&
        effect.naturalHeight > 0
    ){

        ctx.globalAlpha =
            Number(
                opacityInput.value
            ) / 100;

        ctx.globalCompositeOperation =
            "source-over";

        ctx.drawImage(
            effect,
            0,
            0,
            width,
            height
        );
    }

    ctx.globalAlpha = 1;

    ctx.globalCompositeOperation =
        "source-over";

    return true;
}


/* =====================================================
   CANVAS -> BLOB
===================================================== */

function canvasToBlob(){

    return new Promise(
        function(resolve,reject){

            try{

                canvas.toBlob(
                    function(blob){

                        if(blob){

                            resolve(blob);

                        }
                        else{

                            reject(
                                new Error(
                                    t().pngError
                                )
                            );

                        }

                    },
                    "image/png"
                );

            }
            catch(error){

                reject(error);

            }

        }
    );

}


/* =====================================================
   СКАЧИВАНИЕ
===================================================== */

async function downloadPNG(){

    if(busy){

        return;
    }

    if(!photo){

        setStatus(
            t().noPhoto
        );

        return;
    }

    busy = true;

    downloadButton.disabled =
        true;

    setStatus(
        t().preparing
    );

    try{

        /*
         * Перед сохранением
         * обязательно перерисовываем
         */

        const rendered =
            render();

        if(!rendered){

            throw new Error(
                "Render failed"
            );
        }

        const blob =
            await canvasToBlob();

        if(
            !blob ||
            blob.size === 0
        ){

            throw new Error(
                "Empty PNG"
            );
        }

        const url =
            URL.createObjectURL(blob);

        /*
         * Создаём ссылку
         */

        const link =
            document.createElement("a");

        link.href =
            url;

        link.download =
            "photo_overlay.png";

        link.style.position =
            "fixed";

        link.style.left =
            "-9999px";

        document.body.appendChild(
            link
        );

        /*
         * Запускаем скачивание
         */

        link.click();

        /*
         * Очистка

         */

        setTimeout(
            function(){

                try{

                    link.remove();

                }
                catch(e){}

                URL.revokeObjectURL(
                    url
                );

            },
            3000
        );

        setStatus(
            t().downloadStarted
        );

    }
    catch(error){

        console.error(
            "PNG download error:",
            error
        );

        setStatus(
            t().downloadError
        );

    }
    finally{

        busy = false;

        downloadButton.disabled =
            false;

    }

}


/* =====================================================
   ВЫБОР ФОТО
===================================================== */

photoInput.addEventListener(
    "change",
    async function(){

        const file =
            this.files &&
            this.files[0];

        if(!file){

            return;
        }

        try{

            setStatus(
                t().loadingPhoto
            );

            const loadedPhoto =
                await readImage(file);

            photo =
                loadedPhoto;

            /*
             * Фото показываем
             * даже если Effects.png
             * ещё не загрузился.
             */

            render();

            if(effectReady){

                setStatus(
                    t().photoReady
                );

            }
            else{

                setStatus(
                    t().readyWithoutEffect
                );

            }

        }
        catch(error){

            console.error(
                "Photo loading error:",
                error
            );

            photo = null;

            render();

            setStatus(
                t().photoError
            );

        }

        /*
         * Позволяет выбрать
         * тот же файл повторно
         */

        this.value = "";

    }
);


/* =====================================================
   ПРОЗРАЧНОСТЬ
===================================================== */

opacityInput.addEventListener(
    "input",
    function(){

        opacityValue.textContent =
            this.value + "%";

        if(photo){

            render();

        }

    }
);


/* =====================================================
   СКАЧАТЬ
===================================================== */

downloadButton.addEventListener(
    "click",
    function(){

        downloadPNG();

    }
);


/* =====================================================
   ЗАПУСК
===================================================== */

async function init(){

    /*
     * Фото-интерфейс уже работает.
     * Effects.png загружаем отдельно.
     */

    setStatus(
        t().loadingEffect
    );

    try{

        effect =
            await loadEffect();

        effectReady = true;

        setStatus(
            t().effectReady
        );

        /*
         * Если пользователь успел
         * загрузить фото — применяем эффект.
         */

        if(photo){

            render();

            setStatus(
                t().photoReady
            );

        }

        return true;

    }
    catch(error){

        console.error(
            "Effect loading error:",
            error
        );

        /*
         * Главное изменение:
         * ошибка Effects.png больше
         * НЕ ломает приложение.
         */

        effect = null;

        effectReady = false;

        /*
         * Фото всё равно можно загрузить
         * и использовать приложение.
         */

        if(photo){

            render();

        }

        setStatus(
            t().effectError
        );

        return false;
    }

}


/* =====================================================
   GAME READY
===================================================== */

function callGameReady(){

    if(
        !yandexSDKReady ||
        !ysdk
    ){

        return;
    }

    try{

        if(
            ysdk.features &&
            ysdk.features.LoadingAPI &&
            typeof ysdk.features.LoadingAPI.ready === "function"
        ){

            ysdk.features.LoadingAPI.ready();

            console.log(
                "Yandex Games: Game Ready"
            );

        }

    }
    catch(error){

        console.warn(
            "Game Ready error:",
            error
        );

    }
}


/* =====================================================
   START
===================================================== */

async function startApplication(){

    /*
     * Сначала запускаем сам интерфейс.
     * Он больше не зависит от SDK.
     */

    const applicationReady =
        await init();

    /*
     * SDK запускаем параллельно/после
     * основного интерфейса.
     */

    await initYandexSDK();

    /*
     * Game Ready только если SDK действительно
     * успешно инициализирован.
     */

    if(applicationReady){

        callGameReady();

    }

}


/* =====================================================
   START
===================================================== */

startApplication();

</script>

</body>
</html>
