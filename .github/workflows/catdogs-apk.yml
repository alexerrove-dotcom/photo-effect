name: Build Cat vs Dogs APK

on:
  push:
    branches: [ cat-vs-dogs-cloud-build ]
    paths:
      - 'catdogs/**'
      - '.github/workflows/catdogs-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot CI home
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          if [ -d /root/.local/share/godot/export_templates/4.5.stable ]; then
            cp -r /root/.local/share/godot/export_templates/4.5.stable ~/.local/share/godot/export_templates/
          fi
          if [ -d /root/.config/godot ]; then
            cp -r /root/.config/godot ~/.config/ || true
          fi
          godot --version
          java -version

      - name: Parse project and scripts
        shell: bash
        run: |
          cd catdogs
          godot --headless --path . --editor --quit

      - name: Export Android debug APK
        shell: bash
        run: |
          mkdir -p build
          cd catdogs
          godot --headless --verbose --path . --export-debug "Android" ../build/CatVsDogs-WarZone.apk
          test -s ../build/CatVsDogs-WarZone.apk
          ls -lh ../build/CatVsDogs-WarZone.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatVsDogs-WarZone-APK
          path: build/CatVsDogs-WarZone.apk
          if-no-files-found: error
          retention-days: 14
