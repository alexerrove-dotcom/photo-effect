name: Aurora Android test APK
on:
  push:
    branches:
      - 'build/aurora-v02-android'
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Restore Aurora project
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-pip
          mkdir -p Aurora
          base64 --decode aurora-ci-src.b64 > /tmp/aurora-ci-src.zip
          unzip -q /tmp/aurora-ci-src.zip -d Aurora
          sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' Aurora/project.godot
          python3 -m pip install --quiet 'numpy<3' pillow trimesh
          python3 Aurora/tools/generate_original_models.py
          test -f Aurora/assets/models/snow_cabin.glb
          test -f Aurora/assets/icon_432.png
      - name: Import and check Godot scripts
        shell: bash
        run: |
          set -euo pipefail
          HOME=/root godot --headless --path Aurora --import 2>&1 | tee /tmp/aurora-import.log
          if grep -E -i 'Parse Error|script.*error|Failed loading.*script' /tmp/aurora-import.log; then exit 1; fi
      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/root/debug.keystore GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android HOME=/root godot --headless --path Aurora --export-debug "Android" "$GITHUB_WORKSPACE/build/Aurora-v0.2-debug.apk" 2>&1 | tee /tmp/aurora-export.log
          test -s build/Aurora-v0.2-debug.apk
          ls -lh build/Aurora-v0.2-debug.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-v0.2-Android-APK
          path: build/Aurora-v0.2-debug.apk
          if-no-files-found: error
          retention-days: 7
