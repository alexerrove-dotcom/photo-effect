name: Inspect Ready FPS Assets

on:
  push:
    branches: [ cat-vs-dogs-cloud-build ]
    paths: [ '.github/workflows/inspect-ready-fps-assets.yml' ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Download and inspect GLB json
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail -o /tmp/props.glb https://raw.githubusercontent.com/TheJenos/shootup-area-fps/e4880646bac980b6c62aa928907debaf7a3e60c8/public/models/props.glb
          curl -L --fail -o /tmp/guns.glb https://raw.githubusercontent.com/TheJenos/shootup-area-fps/e4880646bac980b6c62aa928907debaf7a3e60c8/public/models/guns.glb
          curl -L --fail -o /tmp/arms.glb https://raw.githubusercontent.com/TheJenos/shootup-area-fps/e4880646bac980b6c62aa928907debaf7a3e60c8/public/models/fpArms.glb
          python - <<'PY'
          import json, struct
          def load(p):
              b=open(p,'rb').read()
              n,t=struct.unpack_from('<II',b,12)
              j=json.loads(b[20:20+n].decode())
              print('\n###',p,'bytes',len(b))
              print('scenes',j.get('scenes'))
              print('nodes',[(i,n.get('name'),n.get('mesh'),n.get('skin'),n.get('children')) for i,n in enumerate(j.get('nodes',[]))])
              print('meshes',[(i,m.get('name'),len(m.get('primitives',[]))) for i,m in enumerate(j.get('meshes',[]))])
              print('anims',[a.get('name') for a in j.get('animations',[])])
              print('materials',[m.get('name') for m in j.get('materials',[])])
          for p in ['/tmp/props.glb','/tmp/guns.glb','/tmp/arms.glb']: load(p)
          PY

      - name: Stage ready FPS assets
        shell: bash
        run: |
          mkdir -p ready-fps-assets
          cp /tmp/props.glb ready-fps-assets/props.glb
          cp /tmp/guns.glb ready-fps-assets/guns.glb
          cp /tmp/arms.glb ready-fps-assets/fpArms.glb
          ls -lh ready-fps-assets

      - name: Upload ready FPS assets
        uses: actions/upload-artifact@v4
        with:
          name: ReadyFPSAssets
          path: ready-fps-assets/
          retention-days: 14
          if-no-files-found: error
